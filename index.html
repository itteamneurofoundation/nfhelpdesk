<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neuro Foundation Facility Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root { --brand: #078c80; --brand-light: #e6f4f2; }
    body { background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
    .bg-brand { background-color: var(--brand); }
    .text-brand { color: var(--brand); }
    .bg-brand-light { background-color: var(--brand-light); }
    .history-box { max-height: 150px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 11.5px; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 250px; padding: 15px 20px; border-radius: 8px; color: white; font-weight: bold; transform: translateX(120%); transition: transform 0.3s; display: flex; align-items: center; gap: 10px;}
    .toast.show { transform: translateX(0); }
    .toast.success { background-color: #10b981; } .toast.error { background-color: #ef4444; } .toast.info { background-color: var(--brand); }
    .search-result { position: absolute; width: 100%; background: white; border: 1px solid #ccc; z-index: 10; max-height: 150px; overflow-y: auto; border-radius: 0 0 8px 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .search-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 12px; }
    .search-item:hover { background: #f0fdfa; }
  </style>

  <script>
    // ==========================================
    // PASTE YOUR GOOGLE SCRIPT WEB APP URL HERE
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqc3LSTUoM5ZJtWypdCJkbfoLDP3I3vC2V2YWBnFrJCdqrzw4ENv930nYPBGnnV8v-oQ/exec"; 

    let currentUser = {};
    let globalMasterData = { targetDepts: [], categories: {}, subCategories: {} };
    let adminTicketsCache = [];
    let adminStaffList = [];

    async function callAPI(action, data) {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: action, data: data }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' } // Text/plain avoids CORS preflight
        });
        return await res.json();
      } catch(e) {
        showToast("Network Connection Error!", "error");
        return {status: "Error"};
      }
    }

    window.onload = async function() {
      const savedSession = localStorage.getItem('neuroDeskSession');
      
      showToast("Connecting to Database...", "info");
      const res = await callAPI('getMasterData', {});
      if(res.status === "Success") {
        globalMasterData = res.data;
        populateMasterDropdowns();
      }

      if(savedSession) {
        currentUser = JSON.parse(savedSession);
        postLoginSetup();
      } else {
        showPage('loginPage');
      }
    };

    function populateMasterDropdowns() {
      let deptHTML = `<option value="">Select Target Department...</option>`;
      globalMasterData.targetDepts.forEach(d => deptHTML += `<option value="${d}">${d}</option>`);
      document.getElementById('targetDept').innerHTML = deptHTML;
      document.getElementById('obTargetDept').innerHTML = deptHTML;
    }

    function updateCategoryDropdown(targetDeptId, catId) {
      const dept = document.getElementById(targetDeptId).value;
      const catDrop = document.getElementById(catId);
      catDrop.innerHTML = '<option value="">Select Category...</option>';
      if(globalMasterData.categories[dept]) {
        globalMasterData.categories[dept].forEach(c => catDrop.innerHTML += `<option value="${c}">${c}</option>`);
      }
    }

    function updateSubCategoryDropdown(catId, subCatId) {
      const cat = document.getElementById(catId).value;
      const subDrop = document.getElementById(subCatId);
      subDrop.innerHTML = '<option value="">Select Details...</option>';
      if(globalMasterData.subCategories[cat]) {
        globalMasterData.subCategories[cat].forEach(s => subDrop.innerHTML += `<option value="${s}">${s}</option>`);
      }
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 100);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function showPage(pageId) {
      document.querySelectorAll('.page-view').forEach(el => el.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
      window.scrollTo(0,0);
    }

    // --- AUTHENTICATION (Seamless Ghost Signup Included) ---
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn'); btn.innerText = "Processing..."; btn.disabled = true;
      const data = {
        empId: e.target.empId.value, name: e.target.name.value, mobile: e.target.mobile.value, dept: "User",
        email: e.target.email.value, username: e.target.username.value, password: e.target.password.value
      };
      const res = await callAPI('registerUser', data);
      btn.innerText = "Register Account"; btn.disabled = false;
      if(res.status === "Success") { showToast(res.msg, 'success'); e.target.reset(); showPage('loginPage'); } 
      else { showToast(res.msg, 'error'); }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn'); btn.innerText = "Authenticating..."; btn.disabled = true;
      const res = await callAPI('loginUser', {username: e.target.username.value, password: e.target.password.value});
      btn.innerText = "Login securely"; btn.disabled = false;
      if(res.status === "Success") {
        currentUser = res;
        localStorage.setItem('neuroDeskSession', JSON.stringify(currentUser));
        postLoginSetup();
      } else { showToast(res.msg, 'error'); }
    }

    function postLoginSetup() {
      document.getElementById('welcomeName').innerText = "Hi, " + currentUser.name.split(' ')[0];
      document.getElementById('navBar').classList.remove('hidden');
      showToast("Welcome to Portal", "success");
      
      if(currentUser.role === "Admin") { showPage('adminDashboard'); initAdminWorkspace(); } 
      else { showPage('userDashboard'); loadMyTickets(); }
    }

    function logout() {
      localStorage.removeItem('neuroDeskSession');
      document.getElementById('navBar').classList.add('hidden');
      showPage('loginPage');
    }

    // --- NORMAL TICKET CREATION ---
    function openRaiseTicket() {
      document.getElementById('ticketEntryName').value = currentUser.name; 
      showPage('raiseTicketPage');
    }

    async function submitTicket(e) {
      e.preventDefault();
      const btn = document.getElementById('ticketBtn'); btn.innerText = "Processing..."; btn.disabled = true;
      const data = {
        creatorRole: "User",
        entryName: e.target.entryName.value, email: currentUser.email, userDept: currentUser.dept, mobile: currentUser.mobile,
        targetDept: e.target.targetDept.value, category: e.target.category.value, subCategory: e.target.subCategory.value, desc: e.target.desc.value,
      };
      const res = await callAPI('createTicket', data);
      btn.innerText = "Submit Ticket"; btn.disabled = false;
      if(res.status === "Success") {
        showToast(`Ticket ${res.ticketId} Created!`, 'success');
        e.target.reset(); showPage('userDashboard'); loadMyTickets();
      }
    }

    async function loadMyTickets() {
      const container = document.getElementById('userTicketTable');
      container.innerHTML = '<p class="text-center py-10 text-gray-500">Fetching records...</p>';
      const res = await callAPI('getMyTickets', {email: currentUser.email});
      
      if(res.data.length === 0) { container.innerHTML = `<p class="text-center py-10">No complaints found.</p>`; return; }

      let html = '';
      res.data.reverse().forEach(t => {
        let isClosed = t.status === 'Closed' || t.status === 'Resolved';
        let feedbackAction = (t.status === 'Resolved' && !t.feedback) ? `<button onclick="openFeedback('${t.targetDept}', ${t.row}, '${t.id}')" class="mt-2 w-full bg-brand text-white py-2 rounded text-sm">Provide Feedback to Close</button>` : '';

        html += `
        <div class="bg-white p-4 rounded-xl shadow border mb-4">
          <div class="flex justify-between border-b pb-2 mb-2">
            <div><span class="font-bold text-lg">${t.id}</span> <p class="text-xs text-gray-500">To: ${t.targetDept}</p></div>
            <span class="px-2 py-1 text-xs font-bold rounded bg-gray-100">${t.status}</span>
          </div>
          <p class="text-sm font-bold">${t.category} > ${t.subCategory}</p>
          <div class="history-box bg-gray-50 p-2 mt-2 border rounded">${t.remarksHistory}</div>
          ${!isClosed ? `<div class="mt-2 flex gap-2"><input type="text" id="uc_${t.targetDept}_${t.row}" class="w-full text-xs p-2 border rounded" placeholder="Reply..."><button onclick="sendUserChat('${t.targetDept}', ${t.row}, '${t.id}')" class="bg-blue-600 text-white px-3 rounded"><i class="fas fa-paper-plane"></i></button></div>` : ''}
          ${feedbackAction}
        </div>`;
      });
      container.innerHTML = html;
    }

    async function sendUserChat(targetDept, row, id) {
      const msg = document.getElementById(`uc_${targetDept}_${row}`).value;
      if(!msg) return;
      await callAPI('addTicketChat', {targetDept: targetDept, row: row, ticketId: id, name: currentUser.name, message: msg, role: "User"});
      showToast("Sent!", "success"); loadMyTickets();
    }

    // --- ADMIN WORKSPACE ---
    async function initAdminWorkspace() {
      document.getElementById('adminTitle').innerText = currentUser.dept + " Admin Workspace";
      document.getElementById('adminTicketTable').innerHTML = '<p class="text-center py-10">Loading Data...</p>';
      
      const res = await callAPI('getAllTickets', {dept: currentUser.dept, role: currentUser.role});
      adminTicketsCache = res.data.reverse();
      adminStaffList = res.staff;
      
      document.getElementById('statTotal').innerText = res.stats.total;
      document.getElementById('statOpen').innerText = res.stats.open;
      document.getElementById('statResolved').innerText = res.stats.resolved;
      
      renderAdminTickets(adminTicketsCache);
    }

    function renderAdminTickets(tickets) {
      let html = '';
      tickets.forEach(t => {
        let isClosed = t.status === 'Closed' || t.status === 'Resolved';
        
        let techOptions = `<option value="Unassigned">Unassigned</option>`;
        adminStaffList.forEach(tech => techOptions += `<option value="${tech}" ${t.assignedTo===tech?'selected':''}>${tech}</option>`);

        let waLink = t.mobile ? `<a href="https://wa.me/91${t.mobile}?text=Status Update: ${t.status}" target="_blank" class="text-green-600 text-xs font-bold ml-2"><i class="fab fa-whatsapp"></i> Chat</a>` : '';

        html += `
        <div class="bg-white p-5 rounded-xl shadow border mb-4">
          <div class="flex justify-between border-b pb-2 mb-2">
            <span class="font-bold text-lg">${t.id} <span class="text-xs bg-gray-100 px-2 ml-2 rounded">${t.assignedTo}</span></span>
            <span class="text-xs font-bold">${t.status}</span>
          </div>
          <p class="text-sm"><b>${t.name}</b> (${t.dept}) - ${t.mobile} ${waLink}</p>
          <p class="text-sm font-bold text-gray-800 mt-1">${t.category} > ${t.subCategory}</p>
          <p class="text-xs bg-yellow-50 p-2 border mt-1 italic">${t.desc}</p>
          <div class="history-box bg-gray-50 border p-2 rounded mt-2">${t.remarksHistory}</div>
          
          ${!isClosed ? `
          <div class="mt-2 flex gap-2"><input type="text" id="ac_${t.row}" class="w-full text-xs p-2 border rounded" placeholder="Send Message to User..."><button onclick="sendAdminChat(${t.row}, '${t.id}')" class="bg-blue-600 text-white px-3 rounded"><i class="fas fa-paper-plane"></i></button></div>
          <div class="bg-gray-50 p-3 rounded border mt-2 flex flex-col md:flex-row gap-2">
            <select id="at_${t.row}" class="text-sm p-2 border rounded">${techOptions}</select>
            <select id="as_${t.row}" class="text-sm p-2 border rounded"><option value="In-Progress" ${t.status=='In-Progress'?'selected':''}>In-Progress</option><option value="Resolved">Mark Resolved</option></select>
            <input type="text" id="ar_${t.row}" class="w-full text-sm p-2 border rounded" placeholder="Status update remark...">
            <button onclick="adminUpdate(${t.row}, '${t.email}', '${t.id}')" class="bg-brand text-white px-4 rounded font-bold">Save</button>
          </div>` : `<div class="bg-green-50 p-2 mt-2 text-green-700 font-bold text-xs text-center rounded">Ticket Closed</div>`}
        </div>`;
      });
      document.getElementById('adminTicketTable').innerHTML = html;
    }

    async function sendAdminChat(row, id) {
      const msg = document.getElementById(`ac_${row}`).value;
      if(!msg) return;
      await callAPI('addTicketChat', {targetDept: currentUser.dept, row: row, ticketId: id, name: currentUser.name, message: msg, role: "Admin"});
      showToast("Sent!", "success"); initAdminWorkspace();
    }

    async function adminUpdate(row, email, id) {
      const status = document.getElementById(`as_${row}`).value;
      const remark = document.getElementById(`ar_${row}`).value;
      const tech = document.getElementById(`at_${row}`).value;
      if(!remark) return showToast("Remark empty!", "error");
      
      showToast("Updating...", "info");
      await callAPI('updateTicketStatus', {targetDept: currentUser.dept, row: row, ticketId: id, adminName: currentUser.name, status: status, newRemark: remark, assignedTech: tech, userEmail: email});
      showToast("Updated!", "success"); initAdminWorkspace();
    }

    // --- GHOST PROFILE / PROXY TICKET (AUTOFILL) ---
    let searchTimeout;
    async function handleGhostSearch(val) {
      const resDiv = document.getElementById('ghostSearchResults');
      if(val.length < 3) { resDiv.innerHTML = ''; return; }
      
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async () => {
        const res = await callAPI('searchUserGhost', {query: val});
        if(res.users && res.users.length > 0) {
          let h = '';
          res.users.forEach(u => h += `<div class="search-item" onclick="fillGhostData('${u.empId}','${u.name}','${u.mobile}','${u.email}','${u.dept}')"><b>${u.name}</b> (${u.empId})</div>`);
          resDiv.innerHTML = h;
        } else { resDiv.innerHTML = ''; }
      }, 500);
    }

    function fillGhostData(id, n, m, e, d) {
      document.getElementById('obEmpId').value = id;
      document.getElementById('obName').value = n;
      document.getElementById('obMobile').value = m;
      document.getElementById('obEmail').value = e;
      document.getElementById('obUserDept').value = d;
      document.getElementById('ghostSearchResults').innerHTML = '';
    }

    async function submitOnBehalfTicket(e) {
      e.preventDefault();
      const btn = document.getElementById('onBehalfBtn'); btn.innerText = "Processing..."; btn.disabled = true;
      const data = {
        creatorRole: "Admin", empId: e.target.obEmpId.value, entryName: e.target.obName.value, 
        mobile: e.target.obMobile.value, email: e.target.obEmail.value, userDept: e.target.obUserDept.value,
        targetDept: e.target.obTargetDept.value, category: e.target.obCategory.value, subCategory: e.target.obSubCategory.value, desc: e.target.obDesc.value
      };
      const res = await callAPI('createTicket', data);
      btn.innerText = "Create Proxy Ticket"; btn.disabled = false;
      if(res.status === "Success") {
        showToast("Proxy Ticket Created!", "success"); e.target.reset(); 
        document.getElementById('adminRaiseTicketModal').classList.add('hidden');
        initAdminWorkspace();
      }
    }
  </script>
</head>
<body class="app-container">
  
  <div id="toast-container"></div>

  <nav id="navBar" class="bg-brand text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-40 hidden">
    <div class="flex items-center gap-3">
      <div class="bg-white text-brand w-9 h-9 rounded-full flex items-center justify-center font-bold text-xl"><i class="fas fa-hospital-symbol"></i></div>
      <div><h1 class="text-sm md:text-lg font-bold">Enterprise Desk</h1></div>
    </div>
    <div class="flex items-center gap-4">
      <span id="welcomeName" class="text-sm font-bold bg-[#056b62] px-3 py-1 rounded-full hidden md:inline"></span>
      <button onclick="logout()" class="text-white bg-red-600 px-3 py-1.5 text-sm rounded shadow"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <div class="content-area p-4 md:p-6 max-w-6xl mx-auto w-full">

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="page-view w-full max-w-md mx-auto mt-10 px-4">
      <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-brand">
        <h2 class="text-2xl font-bold text-center mb-6">Service Portal Login</h2>
        <form onsubmit="handleLogin(event)">
          <input type="text" name="username" placeholder="Username" required class="w-full p-3 mb-4 border rounded bg-gray-50 focus:ring-2 focus:ring-[#078c80] outline-none">
          <input type="password" name="password" placeholder="Password" required class="w-full p-3 mb-6 border rounded bg-gray-50 focus:ring-2 focus:ring-[#078c80] outline-none">
          <button id="loginBtn" type="submit" class="w-full bg-brand text-white font-bold p-3 rounded shadow">Login</button>
        </form>
        <p class="text-center text-sm text-gray-600 mt-4">New User? <button onclick="showPage('regPage')" class="text-brand font-bold">Register</button></p>
      </div>
    </div>

    <!-- REGISTER PAGE -->
    <div id="regPage" class="page-view hidden max-w-md mx-auto mt-6">
      <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-brand">
        <h2 class="text-2xl font-bold text-center mb-6">Register Account</h2>
        <form onsubmit="handleRegister(event)" class="grid gap-4">
          <input type="text" name="empId" placeholder="Employee ID" required class="p-3 border rounded bg-gray-50">
          <input type="text" name="name" placeholder="Full Name" required class="p-3 border rounded bg-gray-50">
          <input type="number" name="mobile" placeholder="Mobile Number" required class="p-3 border rounded bg-gray-50">
          <input type="email" name="email" placeholder="Email Address" required class="p-3 border rounded bg-gray-50">
          <input type="text" name="username" placeholder="Create Username" required class="p-3 border rounded bg-gray-50">
          <input type="password" name="password" placeholder="Create Password" required class="p-3 border rounded bg-gray-50">
          <button id="regBtn" type="submit" class="w-full bg-brand text-white font-bold p-3 rounded">Register</button>
          <button type="button" onclick="showPage('loginPage')" class="text-sm text-gray-500 font-bold mt-2">Back to Login</button>
        </form>
      </div>
    </div>

    <!-- USER DASHBOARD -->
    <div id="userDashboard" class="page-view hidden max-w-3xl mx-auto mt-4">
      <div class="bg-brand rounded-xl p-6 text-white shadow mb-6">
        <h2 class="text-2xl font-bold mb-2">Need Facility Support?</h2>
        <button onclick="openRaiseTicket()" class="bg-white text-brand font-bold px-6 py-2 rounded shadow mt-2">Raise Request / Consumables</button>
      </div>
      <h3 class="font-bold text-lg mb-3">My History <button onclick="loadMyTickets()" class="text-brand text-sm float-right"><i class="fas fa-sync"></i> Refresh</button></h3>
      <div id="userTicketTable"></div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="page-view hidden mt-2">
      <div class="flex justify-between items-center mb-4 bg-white p-4 rounded shadow border">
         <h2 id="adminTitle" class="text-lg font-bold text-gray-800">Admin Workspace</h2>
         <button onclick="document.getElementById('adminRaiseTicketModal').classList.remove('hidden')" class="bg-brand text-white px-4 py-2 rounded shadow font-bold text-sm">Create Proxy Ticket</button>
      </div>

      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-white p-4 rounded shadow border-l-4 border-brand">
          <p class="text-xs text-gray-500 font-bold">Total</p><h3 id="statTotal" class="text-xl font-bold">0</h3>
        </div>
        <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
          <p class="text-xs text-gray-500 font-bold">Open</p><h3 id="statOpen" class="text-xl font-bold">0</h3>
        </div>
        <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
          <p class="text-xs text-gray-500 font-bold">Resolved</p><h3 id="statResolved" class="text-xl font-bold">0</h3>
        </div>
      </div>
      
      <h3 class="font-bold text-lg mb-3">Action Center <button onclick="initAdminWorkspace()" class="text-brand text-sm float-right"><i class="fas fa-sync"></i> Refresh</button></h3>
      <div id="adminTicketTable"></div>
    </div>

    <!-- NORMAL RAISE TICKET MODAL -->
    <div id="raiseTicketPage" class="page-view hidden max-w-lg mx-auto mt-4">
      <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-brand">
        <h2 class="text-xl font-bold mb-6">New Service Request</h2>
        <form onsubmit="submitTicket(event)" class="grid gap-4">
          <input type="text" id="ticketEntryName" name="entryName" readonly class="p-3 border rounded bg-gray-100">
          
          <select id="targetDept" name="targetDept" onchange="updateCategoryDropdown('targetDept', 'primaryCategory')" required class="p-3 border rounded bg-gray-50">
            <option value="">Select Target Department...</option>
          </select>

          <select id="primaryCategory" name="category" onchange="updateSubCategoryDropdown('primaryCategory', 'subCategory')" required class="p-3 border rounded bg-gray-50">
            <option value="">Select Category First...</option>
          </select>

          <select id="subCategory" name="subCategory" required class="p-3 border rounded bg-gray-50">
            <option value="">Select Details First...</option>
          </select>

          <textarea name="desc" rows="3" placeholder="Description / Quantity for Consumables..." required class="p-3 border rounded bg-gray-50"></textarea>

          <div class="flex gap-2 mt-2">
            <button type="button" onclick="showPage('userDashboard')" class="w-1/3 bg-gray-200 text-gray-700 font-bold p-3 rounded">Cancel</button>
            <button id="ticketBtn" type="submit" class="w-2/3 bg-brand text-white font-bold p-3 rounded shadow">Submit Request</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ADMIN PROXY TICKET MODAL (GHOST AUTOFILL) -->
    <div id="adminRaiseTicketModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4">
      <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-lg relative">
        <button onclick="document.getElementById('adminRaiseTicketModal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 text-xl">&times;</button>
        <h3 class="text-xl font-bold mb-4 border-b pb-2">Proxy Ticket (Auto-save)</h3>
        
        <form onsubmit="submitOnBehalfTicket(event)" class="grid gap-3">
          <div class="relative">
             <input type="text" id="obName" name="obName" placeholder="User Name (Type to Search...)" onkeyup="handleGhostSearch(this.value)" autocomplete="off" required class="w-full p-2 border rounded bg-gray-50 text-sm">
             <div id="ghostSearchResults" class="search-result"></div>
          </div>
          
          <div class="grid grid-cols-2 gap-3">
             <input type="text" id="obEmpId" name="obEmpId" placeholder="Emp ID" required class="p-2 border rounded bg-gray-50 text-sm">
             <input type="text" id="obUserDept" name="obUserDept" placeholder="User's Dept" required class="p-2 border rounded bg-gray-50 text-sm">
             <input type="number" id="obMobile" name="obMobile" placeholder="Mobile" required class="p-2 border rounded bg-gray-50 text-sm">
             <input type="email" id="obEmail" name="obEmail" placeholder="Email" required class="p-2 border rounded bg-gray-50 text-sm">
          </div>

          <div class="border-t my-2 pt-2">
            <select id="obTargetDept" name="obTargetDept" onchange="updateCategoryDropdown('obTargetDept', 'obPrimaryCategory')" required class="w-full p-2 mb-3 border rounded bg-gray-50 text-sm">
              <option value="">Select Target Dept...</option>
            </select>
            <div class="grid grid-cols-2 gap-3 mb-3">
              <select id="obPrimaryCategory" name="obCategory" onchange="updateSubCategoryDropdown('obPrimaryCategory', 'obSubCategory')" required class="p-2 border rounded bg-gray-50 text-sm">
                <option value="">Select Category...</option>
              </select>
              <select id="obSubCategory" name="obSubCategory" required class="p-2 border rounded bg-gray-50 text-sm">
                <option value="">Details...</option>
              </select>
            </div>
            <textarea name="obDesc" rows="2" placeholder="Issue Description" required class="w-full p-2 border rounded bg-gray-50 text-sm"></textarea>
          </div>

          <button id="onBehalfBtn" type="submit" class="w-full bg-brand text-white font-bold py-3 mt-1 rounded shadow">Create Proxy Ticket</button>
        </form>
      </div>
    </div>

  </div>
</body>
</html>
